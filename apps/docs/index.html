<!doctype html>
<html lang="en" data-accent="orange" data-font="pair" data-radius="soft" data-density="comfortable">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Monoline</title>
  <meta name="description" content="Monoline: an open-source UI kit with plain CSS tokens and accessible React components." />
  <script>
    // Look preferences before first paint (the same keys and defaults as src/shell/prefs.ts). Without this the prerendered page is laid out
    // with one look and re-laid out with the saved one after hydration, which is a layout shift on every page.
    try {
      var d = document.documentElement, p = JSON.parse(localStorage.getItem('monoline-prefs') || '{}'), t = p.theme || 'system';
      d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'warm') : t;
      ['accent', 'font', 'radius', 'density'].forEach(function (k) { if (p[k]) d.dataset[k] = p[k]; });
      if (p.dir) d.dir = p.dir;
    } catch (e) {}
  </script>
  <script>
    // Restores the deep link that public/404.html saved before redirecting here (the host serves it with status 404 for unknown paths).
    try {
      var r = sessionStorage.getItem('monoline-redirect');
      sessionStorage.removeItem('monoline-redirect');
      if (r && r !== location.href) history.replaceState(null, '', r);
    } catch (e) {}
  </script>
  <script>
    // Applies the saved look before first paint so a saved dark theme, accent or direction does not flash the defaults.
    try {
      var p = JSON.parse(localStorage.getItem('monoline-prefs') || '{}'), h = document.documentElement;
      var t = p.theme || 'system';
      h.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'warm') : t;
      h.dataset.accent = p.accent || 'orange'; h.dataset.font = p.font || 'pair'; h.dataset.radius = p.radius || 'soft'; h.dataset.density = p.density || 'comfortable';
      h.dir = p.dir || 'ltr';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
