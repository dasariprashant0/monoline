name: audit
# Real-browser checks on the built docs site: axe (WCAG 2 A/AA, 2.1, 2.2 AA with colour contrast), overflow,
# console errors. Chrome is preinstalled on ubuntu runners.
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # One job per accent, in parallel (each accent is ~170 pages x 3 themes x 2 viewports in one Chrome).
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        accent: [orange, green, blue, violet, rose, teal, amber, slate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Audit all pages, 3 themes, desktop and 375px, accent ${{ matrix.accent }}
        run: node scripts/audit.mjs --accents ${{ matrix.accent }}
        env:
          CHROME: /usr/bin/google-chrome
  css-computed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Computed-style test (real browser, loads the full stylesheet)
        run: npm run test:css-browser
        env:
          CHROME: /usr/bin/google-chrome
  overlays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Open every overlay on every page; contrast, text overlap, hover and focus in each state
        run: node scripts/audit.mjs --overlays
        env:
          CHROME: /usr/bin/google-chrome
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Example apps in a real browser (flows, overlays, hover, focus)
        run: |
          for n in dashboard auth-settings landing; do (cd examples/$n && npx vite build); done
          node scripts/audit-examples.mjs
        env:
          CHROME: /usr/bin/google-chrome
  # Single check name for the whole audit, so anything that waits for "a11y" keeps working.
  a11y:
    needs: [audit, css-computed, overlays, examples]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all accents and the computed-style test passed"
